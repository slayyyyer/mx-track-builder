# Small 1024 ft pad, useful as a fast smoke test or a pit-bike track.
name: Mini_MX
title: MINI MX
desc: Mini MX
seed: 9

terrain:
  dimension: 8          # 513 x 513 heightfield
  resolution: 2.0       # 1024 x 1024 ft world
  base_height: 30
  relief: 6
  roughness: 0.2

track:
  control_points:
    - [180, 700]        # start / finish
    - [190, 520]
    - [300, 400]
    - [430, 450]
    - [520, 330]
    - [650, 300]
    - [780, 390]
    - [760, 520]
    - [680, 600]
    - [780, 680]
    - [760, 780]
    - [620, 850]
    - [500, 780]
    - [380, 850]
    - [300, 900]
    - [230, 930]
    - [190, 910]
    - [180, 870]
    - [180, 820]        # run onto the start straight
  width: 22
  start_width: 40
  start_taper: 90
  start_flat: 60
  smooth: 35
  edge_falloff: 14

obstacles:
  - {type: jump,   at: "9%",  height: 5, takeoff_angle: 22, gap: 26, landing_length: 22}
  - {type: berm,   at: "35%", length: 60, height: 2.6}
  - {type: whoops, at: "50%", count: 4, spacing: 21, height: 1.8}
  - {type: berm,   at: "60%", length: 55, height: 2.4}
  - {type: rollers, at: "82%", count: 2, spacing: 40, height: 2.6}

theme:
  map:
    size: 512
    background: null
    track_colors: ["#2f7d4f", "#f2e9c9"]
    outline: "#141414"
    outline_width: 8
    track_width: 18
    stripe_length: 160
    title: MINI MX
    title_color: "#ffffff"
    title_outline: "#141414"
    title_size: 64
    title_position: bottom
  ground:
    size: 1024
    base_color: "#7f9660"
    dirt_color: "#8a5a35"
    edge_falloff: 10
    noise: 0.4
    noise_scale: 110

statues:
  - name: rocks
    model: "@Mini_MX/statues/rock.jm"
    texture: "@Mini_MX/statues/rock.png"
    shape: null
    count: 14
    min_distance: 14
    max_distance: 120
    min_spacing: 14

billboards:
  - texture: "@Mini_MX/billboards/tree.png"
    count: 20
    min_distance: 25
    max_distance: 150
    min_spacing: 20
    height: 30
    aspect: 1.0

gates:
  start_at: 0
  start_count: 8
  spacing: 4
  checkpoint_count: 12
